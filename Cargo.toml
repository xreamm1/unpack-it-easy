[package]
name = "uie"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "UIE"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "__screenshot"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
regex = "1"
qrcode = { version = "0.14", default-features = false }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = "thin"
